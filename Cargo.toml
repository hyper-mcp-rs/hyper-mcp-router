[package]
name = "hyper-mcp-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "An adaptive OpenAI-compatible LLM router that classifies prompts and forwards them to an appropriate backend model tier."
license = "Apache-2.0"
publish = false

# `lib.rs` holds the router logic (classifier, proxy, config) so it is reachable
# from the crate's unit tests; `main.rs` is a thin binary wrapper over it.
[lib]
name = "hyper_mcp_router"
path = "src/lib.rs"

[[bin]]
name = "hyper-mcp-router"
path = "src/main.rs"

[dependencies]
anyhow     = "1.0"
async-trait = "0.1"
axum       = "0.8"
clap       = { version = "4", features = ["derive"] }
config     = "0.15"
directories = "6.0"
# Prep for ADC (Application Default Credentials) token refresh behind the
# vertex engine's `TokenSource` seam. Not wired in yet — see TODO(adc).
google-cloud-auth = "1.14"
keyring    = "4.1"
ndarray    = "0.17"   # must match the ndarray version `ort` re-exports
ort        = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
regex      = "1"
reqwest    = { version = "0.13", features = ["stream", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokenizers = "0.23"
tokio      = { version = "1", features = ["full"] }
tracing    = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url        = "2.5"

[build-dependencies]
sha2 = "0.10"
ureq = "3.3"
