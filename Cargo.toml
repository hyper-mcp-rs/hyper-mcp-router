[package]
name = "hyper-mcp-router"
version = "0.1.5"
edition = "2021"
rust-version = "1.97"
description = "An adaptive OpenAI-compatible LLM router that classifies prompts and forwards them to an appropriate backend model tier."
license = "Apache-2.0"
repository = "https://github.com/hyper-mcp-rs/hyper-mcp-router"
readme = "README.md"
keywords = ["llm", "router", "openai", "classifier", "proxy"]
categories = ["web-programming::http-server", "command-line-utilities"]

# `lib.rs` holds the router logic (classifier, proxy, config) so it is reachable
# from the crate's unit tests; `main.rs` is a thin binary wrapper over it.
[lib]
name = "hyper_mcp_router"
path = "src/lib.rs"

[[bin]]
name = "hyper-mcp-router"
path = "src/main.rs"

[dependencies]
anyhow     = "1.0"
async-trait = "0.1"
axum       = "0.8"
clap       = { version = "4.6", features = ["derive"] }
config     = "0.15"
directories = "6.0"
# Just the `Stream` trait (already in the tree via axum/reqwest), for the
# SSE usage-tap passthrough stream in `usage`.
futures-core = "0.3"
# ADC (Application Default Credentials) for the vertex engine family: token
# discovery, caching, and refresh behind its `TokenSource`.
google-cloud-auth = "1.14"
http = "1"
keyring    = "4.1"
ndarray    = "0.17"   # must match the ndarray version `ort` re-exports
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "internal-logs"] }
opentelemetry_sdk = "0.32"
ort        = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
regex      = "1.13"
reqwest    = { version = "0.13", features = ["stream", "json"] }
# Redacting wrapper for resolved credentials: `Debug` never prints the value
# and every access site is an explicit, greppable `expose_secret()` call.
secrecy    = "0.10"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokenizers = "0.23"
tokio      = { version = "1.53", features = ["full"] }
tracing    = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url        = "2.5"

[build-dependencies]
sha2 = "0.11"
ureq = "3.3"

[dev-dependencies]
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"

[package.metadata.release]
publish = true
push = true
tag = true
tag-name = "v{{version}}"
