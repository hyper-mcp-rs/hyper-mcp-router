# Example / default configuration for hyper-mcp-router.
#
# This file is an example template — it is NOT embedded in the binary and is NOT
# read from the repository. Copy it to a well-known location *as* `config.toml`
# (e.g. ~/Library/Application Support/hyper-mcp-router/config.toml on macOS, or
# $XDG_CONFIG_HOME/hyper-mcp-router/config.toml on Linux) or pass it explicitly
# with `--config <path>` (any filename works with `--config`).
#
# Every backend must be OpenAI Chat Completions v1 compatible and expose
# `POST {base_url}/chat/completions`. `base_url` must be a valid http/https URL
# (validated at startup; a malformed or non-HTTP URL is a fatal config error).

[server]
host = "0.0.0.0"
port = 8080
# GET /v1/models always advertises the single virtual model "hyper-mcp-router";
# the configured backends are never listed there. (Upstream response bodies
# pass through verbatim, so a completion's `model` field does name the backend
# that produced it.)
# Upstream timeouts (seconds). No retries are ever performed.
connect_timeout_secs = 10
# Total deadline for NON-streaming requests only. Streaming responses have no
# total deadline (an SSE stream may legitimately run long)…
request_timeout_secs = 600
# …they are bounded by this idle guard instead: abort when no bytes arrive for
# this long (0 disables).
stream_idle_timeout_secs = 300
# Maximum accepted request body size in bytes (default 32 MiB). Base64-encoded
# image/audio/file payloads are large; raise this if yours are larger.
max_body_bytes = 33554432

# Optional classifier tuning. All fields have sensible defaults.
[classifier]
# Which classification model to run (exactly one per process). Currently
# available: "zero-shot" (the embedded NLI model — fully local, the default).
# The --classifier-model CLI flag overrides this.
model = "zero-shot"
# Image-generation modality decision (score floor; scale is engine-specific —
# P(entailment) for the zero-shot engine; default 0.5).
image_generation_threshold = 0.5
# Word ceiling for the trivial fast-path (0 disables; default 6). The
# --trivial-max-words CLI flag overrides this.
trivial_max_words = 6
# Inference parallelism. Omit for auto-sizing from the detected core count;
# CLI flags (--inference-pool-size / --intra-op-threads) override both.
#inference_pool_size = 4
#intra_op_threads = 2

# `api_key` resolves three ways (below), or may be omitted entirely for a
# keyless backend (e.g. a local Ollama / vLLM / LM Studio server, or a gateway
# that injects auth). An omitted field or an empty string "" both mean "no
# auth" — no Authorization header is sent.

# `modalities` is a set; one model may declare several. `tools` marks a model as
# tool/function-calling capable — requests that offer `tools` route only to such
# models (it does not affect the complexity tier). Only `text` coverage is
# mandatory (it is the fallback baseline; at least one model, any tier, must
# declare it). Every other modality is optional — a request that requires an
# uncovered modality is answered with a 422 at request time. (Exception:
# *inferred* image-generation intent is soft — if no model declares
# "image-output", such requests degrade to a text route instead of failing.)

# 1. Plaintext key directly in the file.
[[models]]
name       = "gpt-4.1-mini"
base_url   = "https://api.openai.com/v1"
api_key    = "sk-plaintext-key"
type       = "fast"
modalities = ["text", "tools"]

# 1b. Keyless backend: omit api_key (or set it to "").
[[models]]
name       = "llama3"
base_url   = "http://localhost:11434/v1"
type       = "fast"
modalities = ["text"]

# 2. Environment variable, expanded during config parsing. Use ${VAR:-default}
#    for a fallback, or $${VAR} for a literal.
[[models]]
name       = "gpt-4.1"
base_url   = "https://api.openai.com/v1"
api_key    = "${OPENAI_API_KEY}"
type       = "balanced"
modalities = ["text", "tools"]

# 3. OS keyring lookup.
[[models]]
name       = "o3"
base_url   = "https://api.openai.com/v1"
api_key    = { source = "keyring", service = "hyper-mcp-router", user = "openai-frontier" }
type       = "frontier"
modalities = ["text", "tools"]

# A single multimodal model can cover several modalities at once.
[[models]]
name       = "gpt-4o"
base_url   = "https://api.openai.com/v1"
api_key    = "${OPENAI_API_KEY}"
type       = "balanced"
modalities = ["text", "image-input", "file-input", "image-output", "tools"]

# A dedicated voice model: audio in and audio out (plus text).
[[models]]
name       = "gpt-audio"
base_url   = "https://api.openai.com/v1"
api_key    = "${OPENAI_API_KEY}"
type       = "balanced"
modalities = ["text", "audio-input", "audio-output"]
