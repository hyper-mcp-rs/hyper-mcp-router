# Example / default configuration for hyper-mcp-router.
#
# This file is an example template — it is NOT embedded in the binary and is NOT
# read from the repository. Copy it to a well-known location *as* `config.toml`
# (e.g. ~/Library/Application Support/hyper-mcp-router/config.toml on macOS, or
# $XDG_CONFIG_HOME/hyper-mcp-router/config.toml on Linux) or pass it explicitly
# with `--config <path>` (any filename works with `--config`).
#
# Every backend must be OpenAI Chat Completions v1 compatible and expose
# `POST {base_url}/chat/completions`. `base_url` must be a valid http/https URL
# (validated at startup; a malformed or non-HTTP URL is a fatal config error).

[server]
host = "0.0.0.0"
port = 8080
# GET /v1/models always advertises the single virtual model "hyper-mcp-router";
# the configured backends are never listed there. (Upstream response bodies
# pass through verbatim, so a completion's `model` field does name the backend
# that produced it.)
# Upstream timeouts (seconds). No retries are ever performed.
connect_timeout_secs = 10
# Total deadline for NON-streaming requests only. Streaming responses have no
# total deadline (an SSE stream may legitimately run long)…
request_timeout_secs = 600
# …they are bounded by this idle guard instead: abort when no bytes arrive for
# this long (0 disables).
stream_idle_timeout_secs = 300
# Maximum accepted request body size in bytes (default 32 MiB). Base64-encoded
# image/audio/file payloads are large; raise this if yours are larger.
max_body_bytes = 33554432

# Optional logging content controls. Verbosity is RUST_LOG (an environment
# concern); whether USER CONTENT may appear in logs is deployment policy and
# lives here. With log_prompts = true, every request emits an info-level
# "completion request" event carrying the full current-turn prompt and the
# compiled classification window alongside the routing decision — without
# requiring debug-level noise — and upstream ERROR responses include the
# upstream's error body (bounded) on the warn-level "upstream responded"
# event, since upstream error messages echo request content back.
# Default false: user content never reaches the logs.
# Treat logs produced under this flag as customer data (access + retention).
#[logging]
#log_prompts = false

# Optional OpenTelemetry export (OTLP over HTTP/protobuf). Omit the whole
# table to disable telemetry entirely (no exporters, no background threads,
# no sockets). The endpoint carries NO credentials — point it at a local
# collector sidecar (the recommended topology on Cloud Run / ECS / K8s; the
# collector owns vendor auth) or an equally trusted network hop.
#[telemetry]
#otlp_endpoint = "http://localhost:4318"  # root URL; /v1/traces, /v1/metrics appended
#service_name = "hyper-mcp-router"        # resource attribute on all signals
#traces = true                            # per-request spans (routing, classify, upstream)
#metrics = true                           # counters/histograms (requests, tokens, sizes)
#sample_ratio = 1.0                       # head sampling, applied independently of the
#                                         # caller's decision — platform ingress tracing
#                                         # (e.g. Cloud Run) samples aggressively and
#                                         # would otherwise drop nearly all router spans
#parent_based_sampling = false            # true = OTel-conventional parent-based sampling
#metrics_interval_secs = 60               # metric export interval

# Optional classifier tuning. All fields have sensible defaults. Classifier
# behaviour is config-only — there are no CLI overrides, because each model
# brings its own configuration (a [classifier.<model>] table); different
# classifier models mean different config files.
[classifier]
# Which classification model(s) to run. Available:
#   "deberta-v3-xsmall-zeroshot"  embedded NLI model; fully local (default)
#   "gemini-embedding-001"        remote Gemini embeddings; requires api_key
#   "gemini-embedding-2"          as above, much larger context window
#   "text-embedding-005"          remote Vertex AI embeddings; needs project + token
# NOTE: the remote engines send prompt text (the classification window and
# current turn) to their provider's API (Google); only
# "deberta-v3-xsmall-zeroshot" keeps everything local.
#
# A LIST of models forms a capacity ladder: engines are ordered by their
# context budget (each budget must be unique), and every request is
# classified by the smallest engine whose budget covers its classification
# window — short prompts stay on the cheap engine, long prompts escalate, and
# only a window exceeding even the top engine's budget is truncated. E.g.:
#   model = ["deberta-v3-xsmall-zeroshot", "gemini-embedding-2"]
# PRIVACY: with a mixed local/remote ladder like that one, prompt LENGTH
# decides whether prompt text is sent to the remote provider for
# classification. Configure only local engines if that must never happen
# (the startup log prints each rung with a `local` marker).
model = "deberta-v3-xsmall-zeroshot"
# Image-generation modality decision (score floor; scale is engine-specific —
# P(entailment) for the embedded NLI engine; default 0.5). This is the
# GLOBAL default; every [classifier.<model>] table below can override it with
# its own image_generation_threshold, and with several engines configured you
# should prefer the per-engine keys — the scales differ per engine, so one
# global number cannot fit all of them.
image_generation_threshold = 0.5
# Word ceiling for the trivial fast-path (0 disables; default 6).
trivial_max_words = 6

# Settings specific to the embedded NLI engine (local ORT inference
# sessions). Ignored unless model = "deberta-v3-xsmall-zeroshot". Omit either
# field for auto-sizing from the detected core count and memory budget;
# explicit values the host can't handle are honored but log a startup warning.
[classifier.deberta-v3-xsmall-zeroshot]
#inference_pool_size = 4
#intra_op_threads = 2
#image_generation_threshold = 0.5   # per-engine override (P(entailment) scale)

# Settings for the remote embedding engines. Ignored unless selected above.
# The gemini-embedding models are published on TWO Google API surfaces, and
# the auth fields choose which engine runs — set EXACTLY ONE of:
#   api_key  -> Generative Language API (generativelanguage.googleapis.com);
#               resolves like a routed model's key (plaintext, env-var
#               expansion, or a keyring table)
#   project  -> Vertex AI; auth via ADC by default, or a static access_token
#               override; location is then REQUIRED (a region, or "global"),
#               quota_project optional — as for text-embedding-005 below
# Setting both (or neither) fails fast at startup.
# (Env expansion runs over parsed string VALUES only — commented-out lines
# can never break loading, and an unset variable is only an error on a line
# that is actually active.)
#[classifier.gemini-embedding-001]
#api_key = "${GEMINI_API_KEY}"   # Generative Language API…
##project = "my-gcp-project"       # …OR Vertex AI (never both)
##location = "us-central1"         # REQUIRED with project (a region/"global")
#base_url = "https://generativelanguage.googleapis.com"  # optional override
#max_concurrency = 32          # concurrent embed calls (the "session pool")
#request_timeout_secs = 10     # per embed call
#image_generation_threshold = 0.5  # per-engine override (similarity scale)

#[classifier.gemini-embedding-2]
#api_key = "${GEMINI_API_KEY}"

# text-embedding-005 is published only on Vertex AI (a different API), so it
# takes a GCP project and a location instead of an api_key. location is
# REQUIRED with no default — it determines model availability (some of the
# newest models are served only at multi-region "us"/"eu" or "global"), data
# residency, and the endpoint host: a hyphenated region like "us-central1"
# maps to https://us-central1-aiplatform.googleapis.com, while multi-region
# ("us", "eu") and "global" map to https://aiplatform.googleapis.com. Auth defaults to Application Default
# Credentials — a service-account key file (GOOGLE_APPLICATION_CREDENTIALS),
# `gcloud auth application-default login`, or the GCE/Cloud Run metadata
# server — with token refresh handled automatically. Set access_token only
# to pin a STATIC token instead (e.g. `gcloud auth print-access-token` for a
# quick test; expires ~1h, never refreshed).
# quota_project (optional) attributes API-call quota/billing to a chosen
# project (sent as the x-goog-user-project header). Mostly relevant with
# user-credential ADC or cross-project billing; the principal needs
# serviceusage.services.use on that project.
#[classifier.text-embedding-005]
#project = "my-gcp-project"
#location = "us-central1"                   # REQUIRED: a region, or "global"
#quota_project = "my-billing-project"       # optional quota/billing project
#access_token = "${GOOGLE_ACCESS_TOKEN:-}"  # optional static override of ADC
#base_url = "https://us-central1-aiplatform.googleapis.com"  # optional override
#max_concurrency = 32
#request_timeout_secs = 10

# `api_key` resolves four ways (below), or may be omitted entirely for a
# keyless backend (e.g. a local Ollama / vLLM / LM Studio server, or a gateway
# that injects auth). An omitted field or an empty string "" both mean "no
# auth" — no Authorization header is sent.

# `modalities` is a set; one model may declare several. `tools` marks a model as
# tool/function-calling capable — requests that offer `tools` route only to such
# models (it does not affect the complexity tier). Only `text` coverage is
# mandatory (it is the fallback baseline; at least one model, any tier, must
# declare it). Every other modality is optional — a request that requires an
# uncovered modality is answered with a 422 at request time. (Exception:
# *inferred* image-generation intent is soft — if no model declares
# "image-output", such requests degrade to a text route instead of failing.)

# `context_window` (REQUIRED) is the model's context window in TOKENS (prompt +
# completion), from the provider's model card. Routing only considers models
# whose window fits the request's estimated size (~4 characters per token of
# message text, plus any requested max_tokens/max_completion_tokens) — "fast"
# models often have far smaller windows than "frontier" ones, and sending a
# very large request to a small-window backend is a guaranteed upstream error.
# A request too large for EVERY capable model is still forwarded to the one
# with the largest window (the estimate is a heuristic; the backend is the
# authority) — logged as a warning.

# 1. Plaintext key directly in the file.
[[models]]
name           = "gpt-4.1-mini"
base_url       = "https://api.openai.com/v1"
api_key        = "sk-plaintext-key"
type           = "fast"
modalities     = ["text", "tools"]
context_window = 1047576

# 1b. Keyless backend: omit api_key (or set it to "").
[[models]]
name           = "llama3"
base_url       = "http://localhost:11434/v1"
type           = "fast"
modalities     = ["text"]
context_window = 8192

# 2. Environment variable, expanded during config parsing. Use ${VAR:-default}
#    for a fallback, or $${VAR} for a literal.
[[models]]
name           = "gpt-4.1"
base_url       = "https://api.openai.com/v1"
api_key        = "${OPENAI_API_KEY}"
type           = "balanced"
modalities     = ["text", "tools"]
context_window = 1047576

# 3. OS keyring lookup.
[[models]]
name           = "o3"
base_url       = "https://api.openai.com/v1"
api_key        = { source = "keyring", service = "hyper-mcp-router", user = "openai-frontier" }
type           = "frontier"
modalities     = ["text", "tools"]
context_window = 200000

# 4. Google Application Default Credentials, for backends hosted on Vertex AI
#    (its OpenAI-compatible endpoint takes OAuth Bearer tokens, not API keys).
#    The token is resolved PER REQUEST and auto-refreshed — never a baked-in
#    ~1h gcloud token. Credentials come from the standard ADC chain at
#    startup: GOOGLE_APPLICATION_CREDENTIALS, `gcloud auth application-default
#    login`, or the GCE/Cloud Run metadata server (startup fails fast if none
#    is available). Commented out so the example works without a GCP setup:
#[[models]]
#name           = "google/gemini-2.5-pro"
#base_url       = "https://us-central1-aiplatform.googleapis.com/v1/projects/MY_PROJECT/locations/us-central1/endpoints/openapi"
#api_key        = { source = "google-adc" }
#type           = "frontier"
#modalities     = ["text", "tools"]
#context_window = 1048576

# A single multimodal model can cover several modalities at once.
[[models]]
name           = "gpt-4o"
base_url       = "https://api.openai.com/v1"
api_key        = "${OPENAI_API_KEY}"
type           = "balanced"
modalities     = ["text", "image-input", "file-input", "image-output", "tools"]
context_window = 128000

# A dedicated voice model: audio in and audio out (plus text).
[[models]]
name           = "gpt-audio"
base_url       = "https://api.openai.com/v1"
api_key        = "${OPENAI_API_KEY}"
type           = "balanced"
modalities     = ["text", "audio-input", "audio-output"]
context_window = 128000
