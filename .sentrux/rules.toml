# Architectural constraints for hyper-mcp-router, enforced by `sentrux check .`
# (and surfaced to the agent via the `check_rules` MCP tool).
#
# The crate is a strict, acyclic layering around a pluggable classifier:
#
#     main                (binary entry point: CLI, logging, startup, axum bind)
#       ├─ proxy          (HTTP surface, routing, forwarding, SSE passthrough)
#       │    └─ config         (TOML load, model catalogue, per-engine tables)
#       │         └─ classifier    (ClassifierEngine trait, Classification,
#       │              │            ModelTier, ClassifierModel selector — the
#       │              │            hub; NO concrete engines)
#       │              └─ modality / prompt / planning   (foundational leaves)
#       └─ engines        (one file per model, grouped by provider family —
#                          e.g. engines/gemini/ keeps shared family plumbing
#                          in its mod.rs. Implements the trait; owns all
#                          model-specific sizing. Constructed ONLY by main via
#                          engines::build — the proxy never sees a concrete
#                          engine, only Arc<dyn ClassifierEngine>)
#
#   cli.rs and logging.rs are cross-cutting infrastructure leaves used only by
#   main. Since classifier selection became config-only, cli.rs imports
#   NOTHING from this crate — it is pure argument parsing (--config) and must
#   stay that way.
#
# Dependencies must always flow downward. These rules make that non-negotiable.
# The load-bearing inversion: classifier (the trait hub) must NEVER import
# engines — adding a model must only ever add code under src/engines/.

[constraints]
# The layering is acyclic by design; keep it that way.
max_cycles = 0

# Cap per-function cyclomatic complexity. The most branch-heavy function is the
# `chat_completions` handler; keep routing/inference logic decomposed.
max_cc = 30

# Cap file length. Ceiling leaves room for test-heavy files while still flagging
# runaway *production* growth. The largest file is tests/api_routing.rs (~1340 —
# close to the limit; split it by concern rather than raising the ceiling when
# it trips), a pure integration-test file; production files are dominated by
# their inline `#[cfg(test)]` modules (engine-family integration tests already
# get their own file, e.g. tests/gemini_engine.rs). `no_god_files` is
# intentionally NOT enabled: its hard-coded 500-line threshold would
# false-positive on files that are large only because of their tests.
max_file_lines = 1400

# Overall inter-module coupling grade ceiling.
max_coupling = "B"

# ── Layers ────────────────────────────────────────────────────────────────────
# Imports must flow from lower `order` to higher `order`: order 0 is the entry
# point (top of the call stack) and the highest order is the most foundational
# leaf. A file may only import files at a HIGHER order.
#
# NOTE: this is the direction the installed sentrux (v0.5.x) actually enforces,
# which is inverted from the phrasing in the public docs at sentrux.dev
# ("lower order = more foundational"). The ordering below is chosen to match the
# tool's real behaviour so every genuine dependency flows low -> high:
#
#   main(0) -> proxy(1) -> config(3) -> classifier(4) -> {modality,prompt,planning}(5)
#   main(0) -> engines(2) -> config(3) / classifier(4) / planning(5)
#
# engines sits between proxy and config: it may reach down into config,
# classifier, and the foundational leaves, while nothing below main may reach
# into it.
#
# lib.rs (the crate root that also holds the embedded model bytes) is
# intentionally left unlayered: as the root it declares every module and is
# referenced by engines/deberta_v3_xsmall_zeroshot.rs for MODEL_BYTES, which
# does not fit a strict linear order.

[[layers]]
name = "app"
paths = ["src/main.rs"]
order = 0

[[layers]]
name = "proxy"
paths = ["src/proxy.rs"]
order = 1

[[layers]]
name = "engines"
paths = ["src/engines/**"]
order = 2

[[layers]]
name = "config"
paths = ["src/config.rs"]
order = 3

[[layers]]
name = "classifier"
paths = ["src/classifier.rs"]
order = 4

[[layers]]
name = "foundation"
paths = ["src/modality.rs", "src/prompt.rs", "src/planning.rs"]
order = 5

# ── Boundaries ────────────────────────────────────────────────────────────────
# Sharp, explicit invariants — including for the unlayered infrastructure leaves
# (cli.rs, logging.rs), which layer ordering alone does not constrain. The
# first two are the plugin architecture's load-bearing walls.

[[boundaries]]
from = "src/classifier.rs"
to = "src/engines"
reason = "The trait hub must never know concrete engines; adding a model must only add code under src/engines/."

[[boundaries]]
from = "src/proxy.rs"
to = "src/engines"
reason = "The proxy is engine-agnostic: it sees Arc<dyn ClassifierEngine> only. Engines are constructed exclusively by main via engines::build."

[[boundaries]]
from = "src/cli.rs"
to = "src/engines"
reason = "CLI parsing must stay pure argument parsing; engines are selected and configured via the config file only."

[[boundaries]]
from = "src/cli.rs"
to = "src/classifier.rs"
reason = "Classifier selection is config-only; the CLI must not name, construct, or reference classification types."

[[boundaries]]
from = "src/cli.rs"
to = "src/config.rs"
reason = "The CLI hands main a path; it must never load or interpret configuration itself."

[[boundaries]]
from = "src/cli.rs"
to = "src/proxy.rs"
reason = "CLI parsing must not depend on request handling."

[[boundaries]]
from = "src/logging.rs"
to = "src/classifier.rs"
reason = "Logging is cross-cutting infrastructure; it must not depend on the classification domain."

[[boundaries]]
from = "src/logging.rs"
to = "src/proxy.rs"
reason = "Logging must not depend on request handling."

[[boundaries]]
from = "src/config.rs"
to = "src/proxy.rs"
reason = "Config sits below the proxy; it must not reach up into request handling."

[[boundaries]]
from = "src/classifier.rs"
to = "src/config.rs"
reason = "The classification hub sits below config; it must not depend on configuration."
