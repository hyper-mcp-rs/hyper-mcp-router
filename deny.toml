# cargo-deny configuration.
#
# Docs:        https://embarkstudios.github.io/cargo-deny/
# Run locally: `just security` or `cargo deny check`
#
# Editing rules of thumb:
#   * If a security advisory is unavoidable (e.g. transitive dep with no
#     fix yet), add it to `[advisories].ignore` *with a comment* linking
#     to the upstream issue and an estimated unblock date.
#   * If a new dep brings in a license not on the allow list below, prefer
#     replacing the dep over adding the license. License-graph drift is
#     hard to undo.
#   * `[bans].deny` is the place to record "we tried this crate and it was
#     bad" - keeps the lesson with the codebase.

[graph]
all-features = true

# ─────────────────────────────────────────────────────────────────────────
# Advisories - RustSec database checks. Overlaps with `cargo audit`; we
# keep both because they fail differently (audit is fast and focused;
# deny is policy-driven and can also catch yanked crates and unmaintained
# advisories).
# ─────────────────────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # paste is archived/unmaintained (RUSTSEC-2024-0436). It is a proc-macro —
    # compile-time only, no runtime attack surface — pulled in by tokenizers
    # (latest, 0.23.1) both directly and via macro_rules_attribute; no fixed
    # upstream exists ("no safe upgrade is available"). Unblock: tokenizers /
    # macro_rules_attribute migrating to the pastey fork — re-check this on
    # every tokenizers upgrade. https://rustsec.org/advisories/RUSTSEC-2024-0436
    { id = "RUSTSEC-2024-0436", reason = "tokenizers -> macro_rules_attribute -> paste; compile-time proc-macro only, no fixed upstream yet" },
]

# ─────────────────────────────────────────────────────────────────────────
# Licenses - allowlist model. This list is intentionally conservative for
# proprietary internal use: copyleft (GPL/AGPL/LGPL) is excluded so it
# can't sneak in transitively.
#
# When a new permissive license shows up in a dep, evaluate it explicitly
# rather than auto-allowing - the SPDX list is large.
# ─────────────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Linux Foundation's permissive data-licence. Permissive, not
    # copyleft, no patent grant, no copyleft-style propagation -
    # obligations equivalent to MIT/BSD-3. Currently used by
    # `webpki-roots`, which embeds the Mozilla CA bundle (a dataset)
    # and reaches us transitively via `hyper-rustls` from both
    # `gcp-bigquery-client` and `firestore`.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Windows system crates used by self_update and its dependencies.
# Multiple versions are present due to Windows-specific crates evolving over time.
# These are unavoidable transitive dependencies for Windows builds.
exceptions = []

# Don't require this crate (or any other `publish = false` workspace
# member) to declare a license - internal apps aren't published.
[licenses.private]
ignore = true

# ─────────────────────────────────────────────────────────────────────────
# Bans - duplicate versions, wildcards, blocklist.
#
# `multiple-versions = "warn"` because pinning the entire ecosystem to a
# single version of every transitive dep is a fight you can't win. Bump
# to "deny" only after consolidating duplicates.
#
# Duplicate crates are skipped here because the dependency graph requires
# multiple versions (e.g. old ed25519-dalek vs new, sha2 0.10 vs 0.11).
# These are transitive deps where we have no direct control.
# ─────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = [
    # RustCrypto 0.10 vs 0.11 generation split: google-cloud-auth's stack
    # (rand 0.10, chacha20) is on the new generation while tokenizers and
    # friends still pull the old one.
    "block-buffer",
    "cpufeatures",
    "crypto-common",
    "digest",
    "hmac",
    "sha2",
    # rand 0.9 (tokenizers) vs rand 0.10 (google-cloud-gax), and the
    # rand_core/getrandom/r-efi generations they drag along.
    "getrandom",
    "r-efi",
    "rand",
    "rand_core",
    # base64 0.13 is pinned by spm_precompiled (tokenizers); everything else
    # is on 0.22.
    "base64",
    # core-foundation 0.9 is pinned by system-configuration (hyper-util);
    # rustls-platform-verifier/security-framework are on 0.10.
    "core-foundation",
    # darling 0.20 (derive_builder_core) vs 0.23 (serde_with_macros).
    "darling",
    "darling_core",
    "darling_macro",
    # indexmap/ort/ahash pin different hashbrown generations.
    "hashbrown",
]
skip-tree = [
    # Transitive Windows-support crates pin both the old (0.52) and new
    # (0.61) windows-sys generations.
    { name = "windows-sys", version = "0.52" },
]

# ─────────────────────────────────────────────────────────────────────────
# Sources - only crates.io is allowed. Pulls from arbitrary git repos
# are denied; if you need one, list its URL under `allow-git` *with a
# comment* explaining why.
# ─────────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
